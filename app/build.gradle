import java.io.FileInputStream
import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.protobuf'
}

/*
 * 签名：keystore.properties 不进 git（CI 里由 secrets 还原）。
 * 没有它就用 debug 签名兜底 —— 但 debug 签名与正式包不同，
 * 覆盖安装会失败，所以正式分发必须带 keystore。
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasKeystore = keystoreProperties.getProperty("storeFile") != null

android {
    namespace 'com.kldxst.studio'
    compileSdk 35

    defaultConfig {
        applicationId "com.kldxst.studio"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "2.0.0"
        resourceConfigurations += ["zh", "en"]
        resValue "string", "app_name", "KdSync"

        /*
         * 本地控制台由 WebViewAssetLoader 映射到 appassets 域名，不依赖远端页面。
         * studio/active 仍保留为可选云端接口 origin。
         */
        buildConfigField "String", "CONSOLE_URL", '"https://appassets.androidplatform.net/assets/console/index.html"'
        buildConfigField "String", "CONSOLE_ORIGIN", '"https://appassets.androidplatform.net"'
        buildConfigField "String", "ACTIVE_ORIGIN", '"https://active.kldxst.me"'
        buildConfigField "String", "CONSOLE_HOSTS", '"appassets.androidplatform.net,studio.kldxst.me,active.kldxst.me"'
    }

    signingConfigs {
        if (hasKeystore) {
            create("release") {
                storeFile = rootProject.file(keystoreProperties.getProperty("storeFile"))
                storePassword = keystoreProperties.getProperty("storePassword")
                keyAlias = keystoreProperties.getProperty("keyAlias")
                keyPassword = keystoreProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasKeystore) signingConfig = signingConfigs.getByName("release")
        }
        debug {
            minifyEnabled false
            if (hasKeystore) signingConfig = signingConfigs.getByName("release")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        buildConfig = true
    }
    packaging {
        resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.28.3"
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option "lite"
                }
            }
        }
    }
}

dependencies {
    implementation "com.google.protobuf:protobuf-javalite:4.28.3"
    implementation "org.bouncycastle:bcprov-jdk18on:1.78.1"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.10.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-service:2.6.2"
    implementation "androidx.webkit:webkit:1.8.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    testImplementation "junit:junit:4.13.2"
    // 单测里 android 的 org.json 是空壳，换真实现才能跑协议用例
    testImplementation "org.json:json:20231013"
}
