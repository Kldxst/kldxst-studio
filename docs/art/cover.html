<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#08080B; --panel:#121218; --line:#2B2B36;
    --paper:#EAE4D8; --gray:#948F86; --amber:#E8A33D; --moss:#7FA98A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    width:1080px;height:1440px;overflow:hidden;position:relative;
    background:
      radial-gradient(760px 620px at 82% 6%, rgba(232,163,61,.16), transparent 62%),
      radial-gradient(700px 620px at 6% 96%, rgba(127,169,138,.12), transparent 60%),
      var(--bg);
    color:var(--paper);font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  }
  .grid{
    position:absolute;inset:0;opacity:.30;
    background-image:linear-gradient(rgba(43,43,54,.55) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(43,43,54,.55) 1px, transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(circle at 50% 40%, #000 30%, transparent 78%);
  }
  .wrap{position:relative;padding:74px 68px}
  .kicker{
    display:inline-block;font-size:14px;letter-spacing:.24em;color:var(--amber);
    border:1px solid rgba(232,163,61,.35);border-radius:999px;padding:6px 14px;
  }
  h1{font-size:76px;line-height:1.08;margin-top:26px;font-weight:800;letter-spacing:.01em}
  h1 i{font-style:normal;color:var(--amber)}
  .lead{margin-top:20px;font-size:21px;color:#C9C2B4;line-height:1.65;max-width:620px}
  .bullets{margin-top:44px;display:grid;gap:22px;max-width:580px}
  .b{display:flex;gap:14px;align-items:flex-start;font-size:17px;color:#DDD6C8}
  .b .k{
    flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:rgba(232,163,61,.14);color:var(--amber);font-size:14px;font-weight:700;
    border:1px solid rgba(232,163,61,.28);
  }
  .b small{display:block;color:var(--gray);font-size:14px;margin-top:4px}
  .stats{display:flex;gap:34px;margin-top:46px}
  .stat b{display:block;font-size:30px;font-weight:800;color:var(--paper)}
  .stat b i{font-style:normal;color:var(--amber);font-size:16px;margin-left:4px}
  .stat small{display:block;color:var(--gray);font-size:13px;margin-top:4px}
  .phone{
    position:absolute;right:54px;top:108px;width:562px;height:1216px;
    border-radius:52px;padding:10px;background:linear-gradient(160deg,#26262F,#0B0B10 62%);
    border:1px solid #34343F;
    box-shadow:0 40px 90px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.07);
    transform:rotate(3deg);
  }
  .phone::after{
    content:"";position:absolute;left:50%;top:16px;transform:translateX(-50%);
    width:104px;height:22px;border-radius:12px;background:#050507;
  }
  iframe{width:542px;height:1196px;border:0;border-radius:40px;display:block;background:var(--bg)}
  .bottom{
    position:absolute;left:68px;right:68px;bottom:56px;
    display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid var(--line);padding-top:22px;
  }
  .url{font-size:19px;color:var(--paper)}
  .url b{color:var(--amber)}
  .meta{font-size:14px;color:var(--gray);text-align:right;line-height:1.7}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="kicker">手环工作台</div>
    <h1>K<i>社</i>工坊</h1>
    <p class="lead">连接手环、管理作品、代发联网、查授权。<br>一个应用管完，更新不用重装。</p>

    <div class="bullets">
      <div class="b"><span class="k">设</span><div>设备与作品<small>连接、电量、已装应用、一键启动</small></div></div>
      <div class="b"><span class="k">桥</span><div>网桥<small>代快应用发请求，锁屏保持；白名单与限额可调</small></div></div>
      <div class="b"><span class="k">码</span><div>一个设备码<small>八个作品通用，授权状态随时可查</small></div></div>
      <div class="b"><span class="k">更</span><div>界面在服务端<small>加作品、改流程只刷新页面</small></div></div>
    </div>

    <div class="stats">
      <div class="stat"><b>8<i>个</i></b><small>作品统一管理</small></div>
      <div class="stat"><b>1<i>个</i></b><small>通用设备码</small></div>
      <div class="stat"><b>0<i>次</i></b><small>重装更新</small></div>
    </div>
  </div>

  <div class="phone"><iframe src="https://studio.kldxst.me/?embed=1#device"></iframe></div>

  <div class="bottom">
    <div class="url">studio.kldxst.me · <b>激活站</b> active.kldxst.me</div>
    <div class="meta">Android 7.0 以上<br>小米手环 8 / 9 / 10 Pro</div>
  </div>
</body>
</html>
