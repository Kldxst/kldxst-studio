<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:#08080B; --panel:#121218; --stroke:#2B2B36;
    --paper:#EAE4D8; --gray:#948F86; --amber:#E8A33D; --moss:#7FA98A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    width:1720px;height:1080px;background:
      radial-gradient(900px 600px at 18% 8%, rgba(232,163,61,.10), transparent 62%),
      radial-gradient(800px 600px at 88% 92%, rgba(127,169,138,.09), transparent 60%),
      var(--bg);
    color:var(--paper);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
    padding:56px 64px;overflow:hidden;
  }
  .head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:34px}
  .title{font-size:34px;font-weight:700;letter-spacing:.01em}
  .title i{color:var(--amber);font-style:normal}
  .sub{color:var(--gray);font-size:15px;margin-top:8px;letter-spacing:.02em}
  .badge{
    border:1px solid rgba(232,163,61,.4);background:rgba(232,163,61,.10);color:#F0C98A;
    padding:7px 13px;border-radius:999px;font-size:13px;
  }
  .row{display:flex;gap:34px;align-items:flex-start}
  .item{width:392px}
  .frame{
    width:392px;height:846px;border-radius:44px;padding:10px;
    background:linear-gradient(160deg,#24242E,#0C0C11 62%);
    border:1px solid #33333F;
    box-shadow:0 26px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    position:relative;
  }
  .frame::after{
    content:"";position:absolute;left:50%;top:16px;transform:translateX(-50%);
    width:104px;height:22px;border-radius:12px;background:#050507;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
  }
  iframe{
    width:372px;height:826px;border:0;border-radius:36px;background:var(--bg);
    display:block;
  }
  .cap{margin-top:16px;font-size:15px;color:var(--paper);text-align:center}
  .cap small{display:block;color:var(--gray);font-size:12.5px;margin-top:4px}
</style>
</head>
<body>
  <div class="head">
    <div>
      <div class="title">K<i>社</i>工坊</div>
      <div class="sub">手环工作台 · 控制台四个页面</div>
    </div>
    <div class="badge">studio.kldxst.me</div>
  </div>

  <div class="row">
    <div class="item">
      <div class="frame"><iframe src="https://studio.kldxst.me/?embed=1#device"></iframe></div>
      <div class="cap">设备<small>连接 · 状态 · 直连 · 通知</small></div>
    </div>
    <div class="item">
      <div class="frame"><iframe src="https://studio.kldxst.me/?embed=1#games"></iframe></div>
      <div class="cap">作品<small>清单 · 启动 · 校验安装包</small></div>
    </div>
    <div class="item">
      <div class="frame"><iframe src="https://studio.kldxst.me/?embed=1#bridge"></iframe></div>
      <div class="cap">网桥<small>开关 · 出口策略 · 自检 · 日志</small></div>
    </div>
    <div class="item">
      <div class="frame"><iframe src="https://studio.kldxst.me/?embed=1#settings"></iframe></div>
      <div class="cap">设置<small>设备码 · 授权 · authkey</small></div>
    </div>
  </div>
</body>
</html>
