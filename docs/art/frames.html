<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:
  radial-gradient(760px 560px at 84% 4%, rgba(37,99,235,.10), transparent 62%),
  radial-gradient(700px 560px at 6% 96%, rgba(255,111,165,.10), transparent 60%),
  #F5F7FB;
  color:#141821;font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;overflow:hidden}
.phone{position:relative;background:linear-gradient(160deg,#FFFFFF,#EEF2FA 62%);
  border:1px solid #D9DFEC;border-radius:46px;padding:10px;
  box-shadow:0 26px 60px rgba(37,99,235,.14), inset 0 1px 0 #fff}
.phone::after{content:"";position:absolute;left:50%;top:16px;transform:translateX(-50%);
  width:104px;height:22px;border-radius:12px;background:#E6EBF5}
iframe{border:0;border-radius:38px;display:block;background:#F5F7FB}
body{width:1720px;height:1080px;padding:54px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:30px}
.title{font-size:34px;font-weight:800} .title i{font-style:normal;color:#2563EB} .title b{color:#FF6FA5}
.sub{color:#6B7280;font-size:15px;margin-top:8px}
.badge{border:1px solid #D9DFEC;background:#fff;color:#2563EB;padding:7px 13px;border-radius:999px;font-size:13px}
.row{display:flex;gap:32px;align-items:flex-start}
.item{width:392px} .phone{width:392px;height:846px} iframe{width:372px;height:826px}
.cap{margin-top:14px;font-size:15px;text-align:center;font-weight:650}
.cap small{display:block;color:#6B7280;font-size:12.5px;margin-top:4px;font-weight:400}
</style></head><body>
<div class="head"><div><div class="title">K<i>社</i><b>工坊</b></div>
<div class="sub">手环工作台 · 控制台四个页面</div></div><div class="badge">studio.kldxst.me</div></div>
<div class="row">
  <div class="item"><div class="phone"><iframe src="https://studio.kldxst.me/?embed=1#device"></iframe></div>
    <div class="cap">设备<small>扫描 · 连接 · 握手 · 收包</small></div></div>
  <div class="item"><div class="phone"><iframe src="https://studio.kldxst.me/?embed=1#apps"></iframe></div>
    <div class="cap">应用<small>清单 · 启动 · 卸载 · 校验</small></div></div>
  <div class="item"><div class="phone"><iframe src="https://studio.kldxst.me/?embed=1#bridge"></iframe></div>
    <div class="cap">网桥<small>开关 · 策略 · 自检 · 日志</small></div></div>
  <div class="item"><div class="phone"><iframe src="https://studio.kldxst.me/?embed=1#settings"></iframe></div>
    <div class="cap">设置<small>协议参数 · 发帧 · 授权</small></div></div>
</div></body></html>
